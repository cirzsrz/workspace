name: Create chisa-dev - Clean Citrus Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KERNEL_REPO: "https://github.com/cirzsrz/kernel_xiaomi_citrus.git"
      BASE_BRANCH: "main"
      NEW_BRANCH: "chisa-dev"
    steps:
      - name: Setup Git
        run: |
          git config --global user.name "cirzsrz"
          git config --global user.email "cirzsrz@users.noreply.github.com"
          git config --global http.postBuffer 1048576000

      - name: Clone Kernel Repo
        run: |
          git clone --single-branch --branch $BASE_BRANCH --depth 50 $KERNEL_REPO kernel
          cd kernel
          git checkout -b $NEW_BRANCH

      - name: Remove Non-Citrus Defconfigs
        run: |
          cd kernel/arch/arm64/configs
          ls | grep -v -E "^citrus" | xargs rm -f
          ls -la

      - name: Remove Non-Citrus Device Trees
        run: |
          cd kernel/arch/arm64/boot/dts/qcom
          find . -type f \( -name "*lime*" -o -name "*redmi*" -o -name "*note9*" \) -delete
          find . -type f -name "*citrus*" | sort

      - name: Remove Leftover Lime References
        run: |
          cd kernel
          find . -type d -name "*lime*" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*lime*" -delete 2>/dev/null || true

      - name: Verify Cleanup
        run: |
          cd kernel
          echo "Defconfigs:"
          ls arch/arm64/configs/
          echo ""
          echo "Citrus DTS:"
          find arch/arm64/boot/dts/qcom -name "*citrus*" | sort
          echo ""
          echo "Kernel Version:"
          head -n 5 Makefile
          echo ""
          echo "Changes:"
          git diff --stat

      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd kernel
          AUTH_URL=$(echo "$KERNEL_REPO" | sed "s|https://|https://cirzsrz:${GH_TOKEN}@|")
          git remote set-url origin "$AUTH_URL"
          git add -A

          COMMIT_MSG=$(cat <<'EOF'
chisa-dev: cleanup - Poco M3 (citrus) only

Drop all non-citrus defconfigs
Remove lime / Redmi 9T / Note 9 4G device trees
Strip unused device-specific code
Base: Xiaomi official 4.19.95 lime-q-oss
Target: POCO M3 (citrus) - SM6115 - LA.UM.8.15.r1
EOF
          )

          git commit -m "$COMMIT_MSG"
          git push -u origin $NEW_BRANCH
          echo "Done: https://github.com/cirzsrz/kernel_xiaomi_citrus/tree/chisa-dev"
