name: Repo Cloner

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: "Source Repo URL"
        required: true
        type: string
      source_branch:
        description: "Source Branch"
        required: true
        type: string
      target_repo_name:
        description: "Target Repo"
        required: true
        type: string
      target_branch:
        description: "Target Branch"
        required: true
        default: "main"
        type: string
      shallow_mode:
        description: "Shallow Clone"
        required: false
        default: false
        type: boolean
      shallow_depth:
        description: "Shallow Depth"
        required: false
        default: "1"
        type: string
      git_user_name:
        description: "Commit Author Name"
        required: true
        default: "cirzsrz"
        type: string
      git_user_email:
        description: "Commit Author Email"
        required: true
        default: "cirzsrz@users.noreply.github.com"
        type: string
      push_force:
        description: "Force Push"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BASE: "https://github.com/cirzsrz/"
    steps:
      - name: Setup Git
        run: |
          git config --global user.name "${{ github.event.inputs.git_user_name }}"
          git config --global user.email "${{ github.event.inputs.git_user_email }}"
          git config --global init.defaultBranch ${{ github.event.inputs.target_branch }}
          git config --global http.postBuffer 1048576000
          git config --global pack.threads "0"
          git config --global core.compression 9

      - name: Build Clone Command
        id: build_cmd
        run: |
          BRANCH="${{ github.event.inputs.source_branch }}"
          URL="${{ github.event.inputs.source_repo_url }}"
          SHALLOW="${{ github.event.inputs.shallow_mode }}"
          DEPTH="${{ github.event.inputs.shallow_depth }}"

          CMD="git clone --single-branch --branch $BRANCH"
          [ "$SHALLOW" = "true" ] && CMD="$CMD --depth ${DEPTH:-1}"
          CMD="$CMD $URL source"

          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "$ $CMD"

      - name: Clone Source
        run: |
          ${{ steps.build_cmd.outputs.cmd }}
          cd source
          echo "✅ Clone OK"
          echo "HEAD: $(git log -1 --oneline)"
          echo "Commits: $(git rev-list --count HEAD 2>/dev/null || echo 'N/A (shallow)')"

      - name: Push to Target
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd source
          TARGET_REPO="${{ github.event.inputs.target_repo_name }}"
          TARGET_URL="${TARGET_BASE}${TARGET_REPO}.git"
          AUTH_URL=$(echo "$TARGET_URL" | \
            sed "s|https://|https://${{ github.event.inputs.git_user_name }}:${GH_TOKEN}@|")

          git remote add target "$AUTH_URL"

          FLAGS=""
          [ "${{ github.event.inputs.push_force }}" = "true" ] && FLAGS="--force"

          echo "🚀 Pushing → $TARGET_URL @ ${{ github.event.inputs.target_branch }}"
          git push $FLAGS target HEAD:refs/heads/${{ github.event.inputs.target_branch }}
          echo ""
          echo "✅ Done"
          echo "🔗 ${TARGET_BASE}${TARGET_REPO}/tree/${{ github.event.inputs.target_branch }}"
          
