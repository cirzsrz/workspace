name: Build Kernel & Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v4.19.98-citrus)'
        required: true
        default: 'v4.19.98-citrus'
      release_title:
        description: 'Release title'
        required: true
        default: 'Kernel build from chisa branch'

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: 'cirzsrz/kernel_xiaomi_citrus'
      KERNEL_BRANCH: 'chisa'
      ARCH: arm64
      SUBARCH: arm64

    steps:
      # ------------------------------------------------------------
      # 1. APT packages cache (static key – bump if dependencies change)
      # ------------------------------------------------------------
      - name: Cache APT packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-22.04-kernel-v1

      # ------------------------------------------------------------
      # 2. Clone kernel (shallow, from our target repo & branch)
      # ------------------------------------------------------------
      - name: Clone Kernel Source
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" \
            "https://${{ github.actor }}:${{ secrets.GH_TOKEN }}@github.com/$KERNEL_REPO.git" kernel

      # ------------------------------------------------------------
      # 3. Install build dependencies (uses cached .deb files)
      # ------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 lzop make \
            ncurses-dev rsync unzip

      # ------------------------------------------------------------
      # 4. Proton-Clang toolchain (cached)
      # ------------------------------------------------------------
      - name: Cache Proton-Clang
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: toolchain
          key: proton-clang-${{ runner.os }}-v1

      - name: Download Proton-Clang (if cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/kdrag0n/proton-clang.git toolchain

      # ------------------------------------------------------------
      # 5. ccache (caches compiled objects)
      # ------------------------------------------------------------
      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 2G" >> ~/.ccache/ccache.conf

      # ------------------------------------------------------------
      # 6. Build the kernel
      # ------------------------------------------------------------
      - name: Build Kernel
        working-directory: kernel
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          # Toolchain absolute paths (keeps system 'as' as default)
          export TOOLCHAIN="$PWD/../toolchain"
          export PATH="/usr/lib/ccache:$PATH"          # ccache, but NOT toolchain/bin

          CLANG="$TOOLCHAIN/bin/clang"
          LD_LD="$TOOLCHAIN/bin/ld.lld"
          AR="$TOOLCHAIN/bin/llvm-ar"
          NM="$TOOLCHAIN/bin/llvm-nm"
          OBJCOPY="$TOOLCHAIN/bin/llvm-objcopy"
          OBJDUMP="$TOOLCHAIN/bin/llvm-objdump"
          STRIP="$TOOLCHAIN/bin/llvm-strip"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export HOSTCC=gcc

          # Defconfig – note the hyphen: vendor/citrus-perf_defconfig
          make O=out ARCH=arm64 SUBARCH=arm64 \
               CC="ccache $CLANG" LD="$LD_LD" AR="$AR" NM="$NM" \
               OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
               vendor/citrus-perf_defconfig

          # Full build
          make O=out ARCH=arm64 SUBARCH=arm64 \
               CC="ccache $CLANG" LD="$LD_LD" AR="$AR" NM="$NM" \
               OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
               -j$(nproc)

      # ------------------------------------------------------------
      # 7. Create GitHub Release and upload the kernel image
      # ------------------------------------------------------------
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          KERNEL_IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "❌ Kernel image not found at $KERNEL_IMAGE"
            exit 1
          fi

          gh release create "${{ github.event.inputs.version_tag }}" \
            --repo "$KERNEL_REPO" \
            --title "${{ github.event.inputs.release_title }}" \
            --notes "Built from branch $KERNEL_BRANCH" \
            "$KERNEL_IMAGE"
