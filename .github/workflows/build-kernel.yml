name: Build Kernel & Release (Optimized with APT Cache)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v4.19.98-citrus)'
        required: true
        default: 'v4.19.98-citrus'
      release_title:
        description: 'Release title'
        required: true
        default: 'Kernel build from chisa branch'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: "cirzsrz/kernel_xiaomi_citrus"
      KERNEL_BRANCH: "chisa"

    steps:
      # 1. Cache APT packages (speeds up dependency installation)
      - name: Cache APT packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('dependencies.txt') }}
          restore-keys: |
            apt-${{ runner.os }}-

      # 2. Clone the kernel repo (shallow)
      - name: Clone Kernel Source (shallow)
        run: |
          git clone --depth 1 --branch $KERNEL_BRANCH \
            https://${{ github.actor }}:${{ secrets.GH_TOKEN }}@github.com/$KERNEL_REPO.git kernel

      # 3. Install dependencies (uses cached APT packages)
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 lzop make \
            ncurses-dev rsync unzip

      # 4. Cache Proton-Clang toolchain
      - name: Cache Proton-Clang
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: toolchain
          key: proton-clang-${{ runner.os }}-v1

      - name: Download Proton-Clang (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      # 5. Setup ccache
      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 2G" >> ~/.ccache/ccache.conf

      # 6. Build the kernel
      - name: Build Kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CCACHE_DIR: ~/.ccache
        run: |
          export PATH="$PWD/../toolchain/bin:/usr/lib/ccache:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out ARCH=arm64 SUBARCH=arm64 \
               CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               vendor/citrus_perf-config

          make O=out ARCH=arm64 SUBARCH=arm64 \
               CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               -j$(nproc)

      # 7. Create Release and upload artifacts
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          KERNEL_IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "❌ Kernel image not found!"
            exit 1
          fi

          gh release create "${{ github.event.inputs.version_tag }}" \
            --repo "$KERNEL_REPO" \
            --title "${{ github.event.inputs.release_title }}" \
            --notes "Built from branch $KERNEL_BRANCH" \
            "$KERNEL_IMAGE"
