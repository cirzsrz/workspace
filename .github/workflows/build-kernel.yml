name: Build Kernel & Release (Optimized)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v4.19.98-citrus)'
        required: true
        default: 'v4.19.98-citrus'
      release_title:
        description: 'Release title'
        required: true
        default: 'Kernel build from chisa branch'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: "cirzsrz/kernel_xiaomi_citrus"
      KERNEL_BRANCH: "chisa"

    steps:
      # 1. Cache APT packages (static key, reliable)
      - name: Cache APT packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-22.04-kernel-v1

      # 2. Clone the kernel repo (shallow)
      - name: Clone Kernel Source (shallow)
        run: |
          git clone --depth 1 --branch $KERNEL_BRANCH \
            https://${{ github.actor }}:${{ secrets.GH_TOKEN }}@github.com/$KERNEL_REPO.git kernel

      # 3. Install dependencies (uses cached APT packages)
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 lzop make \
            ncurses-dev rsync unzip

      # 4. Cache Proton-Clang toolchain
      - name: Cache Proton-Clang
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: toolchain
          key: proton-clang-${{ runner.os }}-v1

      - name: Download Proton-Clang (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      # 5. Setup ccache
      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 2G" >> ~/.ccache/ccache.conf

      # 6. Build the kernel (with assembler fix)
      - name: Build Kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CCACHE_DIR: ~/.ccache
        run: |
          export TOOLCHAIN="$PWD/../toolchain"
          # Keep ccache in PATH but do NOT put toolchain/bin at the front
          export PATH="/usr/lib/ccache:$PATH"

          # Use toolchain binaries by absolute path
          CLANG_BIN="$TOOLCHAIN/bin/clang"
          LLD_BIN="$TOOLCHAIN/bin/ld.lld"
          LLVM_AR="$TOOLCHAIN/bin/llvm-ar"
          LLVM_NM="$TOOLCHAIN/bin/llvm-nm"
          LLVM_OBJCOPY="$TOOLCHAIN/bin/llvm-objcopy"
          LLVM_OBJDUMP="$TOOLCHAIN/bin/llvm-objdump"
          LLVM_STRIP="$TOOLCHAIN/bin/llvm-strip"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          # Force host tools to use the system compiler
          export HOSTCC=gcc

          # Generate defconfig
          make O=out ARCH=arm64 SUBARCH=arm64 \
               CC="ccache $CLANG_BIN" LD="$LLD_BIN" AR="$LLVM_AR" NM="$LLVM_NM" \
               OBJCOPY="$LLVM_OBJCOPY" OBJDUMP="$LLVM_OBJDUMP" STRIP="$LLVM_STRIP" \
               vendor/citrus_perf_defconfig

          # Build the kernel
          make O=out ARCH=arm64 SUBARCH=arm64 \
               CC="ccache $CLANG_BIN" LD="$LLD_BIN" AR="$LLVM_AR" NM="$LLVM_NM" \
               OBJCOPY="$LLVM_OBJCOPY" OBJDUMP="$LLVM_OBJDUMP" STRIP="$LLVM_STRIP" \
               -j$(nproc)

      # 7. Create Release and upload artifacts
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          KERNEL_IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "❌ Kernel image not found!"
            exit 1
          fi

          gh release create "${{ github.event.inputs.version_tag }}" \
            --repo "$KERNEL_REPO" \
            --title "${{ github.event.inputs.release_title }}" \
            --notes "Built from branch $KERNEL_BRANCH" \
            "$KERNEL_IMAGE"
